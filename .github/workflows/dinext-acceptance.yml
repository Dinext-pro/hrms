name: Dinext acceptance
on:
  pull_request:
    branches: ['dinext/main/version-15']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dinext-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: ${{ matrix.role == 'cypress' && 'Cypress acceptance' || 'Compatibility acceptance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        role: [compatibility, cypress]
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
      - name: Install bench and browser libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client libmariadb-dev libmariadb-dev-compat \
            libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev redis-tools \
            libgtk-3-0 libgbm1 libnotify4 libnss3 libxss1 libasound2t64 libxtst6 xvfb
          python -m pip install frappe-bench==5.31.0
          npm install --global yarn@1.22.22
      - name: Run paired acceptance
        run: python3 .github/ci/accept_hrms_pair.py ${{ matrix.role }}
